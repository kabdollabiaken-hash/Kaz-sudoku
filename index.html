<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Sudoku</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.6" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="13.9" y="5" width="3.6" height="14" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 4 5.7 4 9s-1.4 6.4-4 9c-2.6-2.6-4-5.7-4-9s1.4-6.4 4-9z"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="9" r="1.1" fill="currentColor" stroke="none"/><circle cx="9" cy="15" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="1.1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><g fill="currentColor" stroke="none"><rect x="7" y="7" width="2.6" height="2.6" rx=".6"/><rect x="10.7" y="7" width="2.6" height="2.6" rx=".6"/><rect x="14.4" y="7" width="2.6" height="2.6" rx=".6"/><rect x="7" y="10.7" width="2.6" height="2.6" rx=".6"/><rect x="10.7" y="10.7" width="2.6" height="2.6" rx=".6"/><rect x="14.4" y="10.7" width="2.6" height="2.6" rx=".6"/><rect x="7" y="14.4" width="2.6" height="2.6" rx=".6"/><rect x="10.7" y="14.4" width="2.6" height="2.6" rx=".6"/><rect x="14.4" y="14.4" width="2.6" height="2.6" rx=".6"/></g></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="3.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M12 12.4l1 2 2.2.3-1.6 1.5.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.5 2.2-.3z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-swords" viewBox="0 0 24 24"><path d="M4 4l11 11"/><path d="M20 4L9 15"/><path d="M13 17l4-4"/><path d="M11 17L7 13"/><path d="M15 15l4.5 4.5"/><path d="M9 15l-4.5 4.5"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-chevd" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-11" stroke-width="3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.6l2.8 2.8 5.6-6"/></symbol>
    <symbol id="i-checkfill" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="M7.6 12.6l3 3 5.8-6.2" stroke="#1a1405" stroke-width="2.2"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.8M9.5 2.5h5M12 2.5v3"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4.5 4.5v4.5H9"/></symbol>
  </defs>
</svg>

<div id="app">

  <!-- HOME -->
  <section id="screen-home" class="screen active">
    <header class="top">
      <div class="ttl"><h1 data-i18n="title">Sudoku</h1><div class="pills"><span id="streak-pill" class="pill-flame"><svg class="ic"><use href="#i-flame"/></svg><span id="streak-txt"></span></span><button id="btn-shop" class="pill-gem" type="button">💎 <b id="gem-txt">0</b> 🛒</button></div></div>
      <div class="top-actions">
        <div class="lang-wrap"><button id="btn-lang" class="chip" type="button" aria-haspopup="listbox" aria-expanded="false"><svg class="ic"><use href="#i-globe"/></svg><span id="lang-label"></span><svg class="ic chev"><use href="#i-chevd"/></svg></button><div id="lang-menu" class="lang-menu" role="listbox" hidden></div></div>
        <button id="btn-settings" class="icon-btn" type="button" aria-label="Settings"><svg class="ic"><use href="#i-gear"/></svg></button>
      </div>
    </header>
    <div class="page">
      <button id="btn-continue" class="go-card" type="button" hidden>
        <span class="go-ic"><svg class="ic"><use href="#i-play"/></svg></span>
        <span id="cont-text" class="go-text"></span>
        <span class="go-right"><span data-i18n="goOn">Resume</span><svg class="ic"><use href="#i-chev"/></svg></span>
      </button>

      <div class="card">
        <div class="card-title"><svg class="ic"><use href="#i-dice"/></svg><span data-i18n="newGame">New game</span></div>
        <div class="row3">
          <button class="btn diff tile easy" type="button" data-diff="easy"><span class="tile-ic"><svg class="ic"><use href="#i-grid"/></svg></span><span class="tn" data-i18n="easy">Easy</span><small class="tsz">4×4</small><span class="tag" data-i18n="tagEasy"></span><span class="tbest" id="best-easy"></span></button>
          <button class="btn diff tile medium" type="button" data-diff="medium"><span class="tile-ic"><svg class="ic"><use href="#i-grid"/></svg></span><span class="tn" data-i18n="medium">Medium</span><small class="tsz">6×6</small><span class="tag" data-i18n="tagMedium"></span><span class="tbest" id="best-medium"></span></button>
          <button class="btn diff tile hard" type="button" data-diff="hard"><span class="tile-ic"><svg class="ic"><use href="#i-grid"/></svg></span><span class="tn" data-i18n="hard">Hard</span><small class="tsz">9×9</small><span class="tag" data-i18n="tagHard"></span><span class="tbest" id="best-hard"></span></button>
        </div>
      </div>

      <button id="btn-daily" class="btn rc-big gold" type="button">
        <svg class="ic ri"><use href="#i-cal"/></svg>
        <span class="rc-main"><b id="daily-title"></b><small data-i18n="dailySub"></small></span>
        <span class="pill-btn"><svg id="daily-check" class="ic chk" hidden><use href="#i-checkfill"/></svg><span id="daily-go" data-i18n="goBtn"></span><svg class="ic"><use href="#i-chev"/></svg></span>
      </button>
      <button id="btn-online" class="btn rc-big violet" type="button">
        <svg class="ic ri"><use href="#i-swords"/></svg>
        <span class="rc-main"><b data-i18n="online"></b><small data-i18n="onlineSub"></small></span>
        <span class="pill-btn"><span data-i18n="goBtn"></span><svg class="ic"><use href="#i-chev"/></svg></span>
      </button>
      <button id="btn-board" class="btn rc-big amber" type="button">
        <svg class="ic ri"><use href="#i-trophy"/></svg>
        <span class="rc-main"><b data-i18n="leaderboard"></b><small data-i18n="boardSub"></small></span>
        <span class="rc-right"><svg class="ic"><use href="#i-chev"/></svg></span>
      </button>

      <div class="card">
        <div class="card-title"><svg class="ic"><use href="#i-chart"/></svg><span data-i18n="stats">Stats</span></div>
        <div id="stats-grid" class="stats-grid"></div>
      </div>
      <button id="btn-install" class="btn ghost" type="button" hidden data-i18n="install">Install</button>
    </div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen">
    <header class="game-top">
      <button id="g-back" class="icon-btn" type="button" aria-label="Back">←</button>
      <div class="g-title"><b id="g-title"></b></div>
      <div class="g-time">
        <span id="g-timer">00:00</span>
        <button id="g-pause" class="icon-btn small" type="button" aria-label="Pause"><svg class="ic"><use href="#i-pause"/></svg></button>
        <button id="g-restart" class="icon-btn small" type="button" aria-label="Restart"><svg class="ic"><use href="#i-restart"/></svg></button>
      </div>
    </header>
    <div id="battle-bar" hidden>
      <div class="bb-row"><span data-i18n="you">You</span><div class="bar"><i id="bb-you"></i></div><b id="bb-you-pct">0%</b></div>
      <div class="bb-row"><span data-i18n="opponent">Opponent</span><div class="bar opp"><i id="bb-opp"></i></div><b id="bb-opp-pct">0%</b></div>
    </div>
    <div class="g-stats"><span><span data-i18n="mistakes">Mistakes</span>: <b id="g-mist">0</b></span><span id="g-hintct"></span></div>
    <div id="board-wrap">
      <div id="board"></div>
      <div id="pause-overlay" hidden>
        <div class="po-box">
          <div class="po-title" data-i18n="paused">Paused</div>
          <button id="btn-resume" class="btn primary" type="button" data-i18n="resume">Resume</button>
          <button id="btn-restart" class="btn ghost" type="button" data-i18n="restart">Restart</button>
        </div>
      </div>
    </div>
    <div class="tools">
      <button id="t-undo" class="tool" type="button"><span class="ti">↶</span><span data-i18n="undo">Undo</span></button>
      <button id="t-erase" class="tool" type="button"><span class="ti">⌫</span><span data-i18n="erase">Erase</span></button>
      <button id="t-notes" class="tool" type="button"><span class="ti">✎</span><span data-i18n="notes">Notes</span></button>
      <button id="t-hint" class="tool" type="button"><span class="ti">💡</span><span data-i18n="hint">Hint</span></button>
    </div>
    <div id="item-bar" hidden></div>
    <div id="pad" class="pad"></div>
  </section>

  <!-- SHOP -->
  <section id="screen-shop" class="screen">
    <header class="top">
      <button id="shop-back" class="icon-btn" type="button" aria-label="Back">←</button>
      <h2 data-i18n="shop">Shop</h2>
      <span class="pill-gem static">💎 <b id="shop-gems">0</b></span>
    </header>
    <div class="page">
      <div class="notice" data-i18n="shopTip"></div>
      <div id="shop-list" class="shop-list"></div>
    </div>
  </section>

  <!-- ONLINE LOBBY -->
  <section id="screen-online" class="screen">
    <header class="top">
      <button id="on-back" class="icon-btn" type="button" aria-label="Back">←</button>
      <h2 data-i18n="online">Online</h2>
      <span class="spacer"></span>
    </header>
    <div class="page">
      <div id="on-notcfg" class="notice" hidden data-i18n="notConfigured"></div>
      <div id="on-menu">
        <button id="on-quick" class="btn primary quick" type="button" data-i18n="quickMatch">Quick match</button>
        <div class="card">
          <div class="card-title"><span data-i18n="createRoom">Create room</span></div>
          <div class="seg" id="on-diffs">
            <button type="button" data-od="easy" data-i18n="easy">Easy</button>
            <button type="button" data-od="medium" class="on" data-i18n="medium">Medium</button>
            <button type="button" data-od="hard" data-i18n="hard">Hard</button>
          </div>
          <label class="pubrow"><input id="on-pub" type="checkbox" checked><span data-i18n="publicRoom">Public room</span></label>
          <button id="on-create" class="btn primary" type="button" data-i18n="createRoom">Create room</button>
        </div>
        <div class="card">
          <div class="card-title"><span data-i18n="publicRooms">Open rooms</span></div>
          <div id="on-rooms" class="rooms"></div>
        </div>
        <div class="card">
          <div class="card-title"><span data-i18n="joinRoom">Join room</span></div>
          <div class="row">
            <input id="on-code" class="input code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" data-i18n-ph="enterCode" placeholder="Code">
            <button id="on-join" class="btn primary" type="button" data-i18n="join">Join</button>
          </div>
        </div>
      </div>
      <div id="on-lobby" hidden>
        <div class="card center">
          <div class="muted" data-i18n="roomCode">Room code</div>
          <div id="on-roomcode" class="bigcode"></div>
          <div id="on-roomdiff" class="muted"></div>
          <button id="on-share" class="btn primary" type="button" data-i18n="shareRoom">Share</button>
          <button id="on-copy" class="btn ghost" type="button" data-i18n="copyLink">Copy invite link</button>
          <div id="on-status" class="status"></div>
          <button id="on-start" class="btn primary" type="button" hidden data-i18n="start">Start</button>
        </div>
      </div>
      <div id="on-msg" class="notice" hidden></div>
    </div>
  </section>

  <!-- LEADERBOARD -->
  <section id="screen-board" class="screen">
    <header class="top">
      <button id="lb-back" class="icon-btn" type="button" aria-label="Back">←</button>
      <h2 data-i18n="leaderboard">Leaderboard</h2>
      <span class="spacer"></span>
    </header>
    <div class="page">
      <div class="seg" id="lb-tabs">
        <button type="button" data-lb="daily" class="on" data-i18n="today">Today</button>
        <button type="button" data-lb="easy" data-i18n="easy">Easy</button>
        <button type="button" data-lb="medium" data-i18n="medium">Medium</button>
        <button type="button" data-lb="hard" data-i18n="hard">Hard</button>
      </div>
      <div id="lb-notcfg" class="notice" hidden data-i18n="notConfigured"></div>
      <ol id="lb-list" class="lb-list"></ol>
      <div class="card" id="lb-mine">
        <div class="card-title"><span data-i18n="myBest">My best times</span></div>
        <div id="lb-mine-grid" class="stats-grid"></div>
      </div>
    </div>
  </section>
</div>

<!-- SETTINGS -->
<div id="modal-settings" class="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="sheet-head"><b data-i18n="settings">Settings</b><button id="set-close" class="icon-btn small" type="button" aria-label="Close">✕</button></div>

    <div class="set-group">
      <div class="set-label" data-i18n="theme">Theme</div>
      <div class="seg" id="set-theme">
        <button type="button" data-th="dark" data-i18n="dark">Dark</button>
        <button type="button" data-th="light" data-i18n="light">Light</button>
        <button type="button" data-th="auto" data-i18n="auto">Auto</button>
      </div>
    </div>

    <div class="set-sep"></div>

    <div class="set-group">
      <div class="set-label" data-i18n="gameAssist">Game assist</div>
      <label class="switch-row"><span class="sw-t"><b data-i18n="showErrors">Highlight mistakes</b><small data-i18n="showErrorsD"></small></span><input id="set-errors" class="sw" type="checkbox"></label>
      <label class="switch-row"><span class="sw-t"><b data-i18n="highlightSame">Highlight same digits</b><small data-i18n="highlightSameD"></small></span><input id="set-same" class="sw" type="checkbox"></label>
      <label class="switch-row"><span class="sw-t"><b data-i18n="autoNotes">Auto-clear notes</b><small data-i18n="autoNotesD"></small></span><input id="set-autonotes" class="sw" type="checkbox"></label>
      <label class="switch-row"><span class="sw-t"><b data-i18n="showTimer">Show timer</b><small data-i18n="showTimerD"></small></span><input id="set-timer" class="sw" type="checkbox"></label>
      <label class="switch-row"><span class="sw-t"><b data-i18n="sfxSound">Sound</b><small data-i18n="sfxSoundD"></small></span><input id="set-sound" class="sw" type="checkbox"></label>
      <label class="switch-row"><span class="sw-t"><b data-i18n="sfxFx">Effects</b><small data-i18n="sfxFxD"></small></span><input id="set-fx" class="sw" type="checkbox"></label>
    </div>

    <div class="set-sep"></div>

    <div class="set-group">
      <div class="set-label" data-i18n="battleId">Battle identity</div>
      <div class="id-row"><span class="muted" data-i18n="playerId">Player ID</span><span id="set-pid" class="pid"></span><button id="set-copy" class="btn ghost small" type="button" data-i18n="copy">Copy</button></div>
      <div class="set-sub" data-i18n="nickname">Nickname (optional)</div>
      <input id="set-name" class="input" maxlength="20" autocomplete="off">
    </div>
  </div>
</div>

<!-- GENERIC MODAL -->
<div id="modal" class="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <div id="modal-title" class="modal-title"></div>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-actions" class="modal-actions"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="core.js"></script>
<script src="i18n.js"></script>
<script src="config.js"></script>
<script src="track.js"></script>
<script src="app.js"></script>
<script src="online.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
